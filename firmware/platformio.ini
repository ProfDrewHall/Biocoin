; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = release

[env:base]
framework = arduino
platform = nordicnrf52
board = adafruit_feather_nrf52840

; This patches the default variant directory to include our custom variant with the Biocoin board definition.
board_build.variants_dir = ./src/variants
board_build.variant = biocoin

lib_deps = adafruit/Adafruit NeoPixel@^1.15.1
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
;monitor_auto_reconnect = yes

[env:debug]
extends = env:base
build_flags =
	; Debugging mode: This enables serial logging and debug BLE endpoints. Will NOT work if you use Pstrace.
	-DDEBUG_MODE
	; Project log verbosity for src/util/debug_log.h (NONE=0, ERROR=1, WARN=2, INFO=3).
	-DDEBUG_LEVEL=DBG_LEVEL_INFO
	; For NRF BLE debugging (CFG_DEBUG: 0=Release, 1=Error Message, 2=Full Debug, 3=Segger SystemView)
	-DCFG_DEBUG=2

[env:release]
extends = env:base
build_flags =
	; Production hardening: excludes debug BLE endpoints unless explicitly overridden.
	-DCFG_DEBUG=0
